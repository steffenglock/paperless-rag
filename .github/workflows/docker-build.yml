# GitHub Actions workflow for multi-arch Docker build and push to Docker Hub.
# Triggers on push to main and on the prepared stable v0.2.0 release tag.

name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v0.2.0"
  workflow_dispatch:    # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Multi-Arch Image
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Meta ─────────────────────────────────────────────────────
      # Publish only the supported channel tags:
      # - main branch → :latest
      # - v0.2.0 tag  → :0.2, :latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/paperless-rag
          tags: |
            type=raw,value=0.2,enable=${{ github.ref == 'refs/tags/v0.2.0' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v0.2.0' }}

      # ── QEMU ────────────────────────────────────────────────────────────
      # Required for cross-platform builds (arm64 on amd64 runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Buildx ──────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login ────────────────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build & Push ─────────────────────────────────────────────────────
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds for faster CI
          cache-from: type=gha
          cache-to: type=gha,mode=max
